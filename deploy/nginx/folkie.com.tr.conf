# Folkie nginx site config
# Drop this at /etc/nginx/sites-available/folkie.com.tr and symlink into sites-enabled.
# Run `certbot --nginx -d folkie.com.tr -d www.folkie.com.tr` AFTER DNS is live —
# certbot rewrites this file to add SSL on 443 and an HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name folkie.com.tr www.folkie.com.tr;

    # Health check + ACME challenges go through here on port 80.
    # Certbot will rewrite everything else to 443 after issuing the cert.

    client_max_body_size 25M;

    # Next.js owns /api/proxy/* — must come before /api/ to win nginx prefix match
    location /api/proxy/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend API — backend already uses /api/v1/* prefix, so do NOT strip
    location /api/ {
        proxy_pass http://127.0.0.1:5069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR (WebSocket) hubs
    location /hubs/ {
        proxy_pass http://127.0.0.1:5069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Clerk webhook (svix) → backend
    location = /webhooks/clerk {
        proxy_pass http://127.0.0.1:5069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probe
    location = /healthz {
        proxy_pass http://127.0.0.1:5069;
        access_log off;
    }

    # Hangfire dashboard — basic auth via .htpasswd
    location /hangfire {
        auth_basic "Folkie Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-folkie;
        proxy_pass http://127.0.0.1:5069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

