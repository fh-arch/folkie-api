services:
  postgres:
    image: postgres:16-alpine
    container_name: folkie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: folkie
      POSTGRES_PASSWORD: folkie_dev
      POSTGRES_DB: folkie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folkie"]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: folkie-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Lokal dev için auth devre dışı — production'da SEQ_FIRSTRUN_ADMINPASSWORD ayarla
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"      # Seq HTTP UI + ingest
    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data:
